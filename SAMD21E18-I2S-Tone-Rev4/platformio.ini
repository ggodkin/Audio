; ATSAMD21E18A bare-chip I2S tone generator for MAX98357A
; Flash / debug with ST-LINK V2 (SWD)

[env:samd21e18]
platform = atmelsam
board = sparkfun_qwiic_micro_samd21e
board_build.mcu = samd21e18a
board_build.f_cpu = 48000000L
framework = arduino

; Use the no-bootloader linker script (bare chip starts at 0x0000)
board_build.ldscript = ${platformio.packages_dir}/framework-arduino-samd-sparkfun/variants/SparkFun_Qwiic_Micro/linker_scripts/gcc/flash_without_bootloader.ld

build_flags =
    -D__SAMD21E18A__
    -D__ATSAMD21E18A__
    -DI2S_INTERFACES_COUNT=1
    -DI2S_DEVICE=0
    -DI2S_CLOCK_GENERATOR=3

; ST-LINK V2 (already working)
upload_protocol = custom
upload_command = openocd -c "adapter driver hla" -c "hla_layout stlink" -c "hla_device_desc ST-LINK" -c "hla_vid_pid 0x0483 0x3748" -c "transport select hla_swd" -c "set CHIPNAME at91samd21e18" -c "set CPUTAPID 0x0bc11477" -f target/at91samdXX.cfg -c "adapter speed 100" -c "program $SOURCE verify reset exit"

monitor_speed = 115200
