[env:samd21e18]
platform = atmelsam
board = sparkfun_qwiic_micro_samd21e
board_build.mcu = samd21e18a
board_build.f_cpu = 48000000L
framework = arduino

build_flags =
    -I include
    -D__SAMD21E18A__
    -D__ATSAMD21E18A__

; PlatformIO's board definition does not provide an ST-LINK uploader.
; Use the installed OpenOCD 0.12.0 configuration for the SAMD21 target.
upload_protocol = custom
upload_command = openocd -c "adapter driver st-link" -c "transport select dapdirect_swd" -c "adapter speed 1000" -f target/at91samdXX.cfg -c "program $SOURCE verify reset exit"

; PlatformIO/Arduino supplies the startup code and linker script.
; The project's original startup.c is retained as historical reference
; but is excluded from this build.
build_src_filter =
    +<main.c>
    -<startup.c>
