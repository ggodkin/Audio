[env:samd21e18]
platform = atmelsam
board = samd21e18a
framework = arduino

upload_protocol = cmsis-dap
upload_flags =
    -c
    transport select swd

monitor_speed = 115200

build_flags =
    -I include
    -D__SAMD21E18A__
    -D__ATSAMD21E18A__

build_unflags =
    -DARDUINO_USB_MODE

board_build.ldscript = linker.ld
