[env:samd21e18]
platform = atmelsam
board = sparkfun_qwiic_micro_samd21e
board_build.mcu = samd21e18a
board_build.f_cpu = 48000000L
framework = arduino

build_flags =
    -I include
    -D__SAMD21E18A__
    -D__ATSAMD21E18A__

    ; SparkFun Qwiic Micro's variant does not define the I2S macros
    ; expected by Arduino's SAMD I2S library.
    -DI2S_INTERFACES_COUNT=1
    -DI2S_DEVICE=0
    -DI2S_CLOCK_GENERATOR=3
    -DPIN_I2S_SD=0
    -DPIN_I2S_SCK=13
    -DPIN_I2S_FS=33

; PlatformIO's board definition does not provide an ST-LINK uploader.
; Use the installed OpenOCD 0.12.0 configuration for the SAMD21 target.
upload_protocol = custom
upload_command = openocd -c "adapter driver hla" -c "hla_layout stlink" -c "hla_device_desc ST-LINK" -c "hla_vid_pid 0x0483 0x3748" -c "transport select hla_swd" -c "set CHIPNAME at91samd21g18" -c "set CPUTAPID 0x0bc11477" -f target/at91samdXX.cfg -c "adapter speed 100" -c "program $SOURCE verify reset exit"

; PlatformIO/Arduino supplies the startup code and linker script.
; The original direct-register main.c is retained for comparison,
; but the library diagnostic uses main.cpp.
build_src_filter =
    +<main.cpp>
    -<main.c>
    -<startup.c>
