[env:samd21e18]
platform = atmelsam
board = sparkfun_qwiic_micro_samd21e
board_build.mcu = samd21e18a
board_build.f_cpu = 48000000L
framework = arduino

build_flags =
    -I include
    -D__SAMD21E18A__
    -D__ATSAMD21E18A__

upload_protocol = cmsis-dap

; PlatformIO/Arduino supplies the startup code and linker script.
; The project's original startup.c is retained as historical reference
; but is excluded from this build.
build_src_filter =
    +<main.c>
    -<startup.c>
